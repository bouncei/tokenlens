name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No untrusted github.event inputs are used in any run: step.
# Only matrix.node-version (a controlled static array) is interpolated.

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test compiled binary
        run: |
          ./dist/index.js --help > /dev/null
          echo "binary loaded and exited cleanly"
